name: BloodMoon
version: 1.1.0
main: org.spectralmemories.bloodmoon.Bloodmoon
load: POSTWORLD
softdepend:
  - "Multiverse-Core"
  - "WorldGuard"
  - "MythicMobs"
  - "PlaceholderAPI"
api-version: 1.21
authors: [SpectralMemories]
contributors: [JulioN12]
website: https://github.com/julion12/BloodMoon-Reborn
description: Configurable per-world Blood Moon events for Paper and Purpur
commands:
  bloodmoon:
    description: Controls Blood Moon status, lifecycle, hordes, bosses, and reload
    usage: /bloodmoon <show|status|start|stop|reload|survivors|spawnzombieboss|spawnhorde|killbosses>
    permission: "bloodmoon.bloodmoon"
    permission-message: "You do not have the permission to do this"
permissions:
  bloodmoon.bloodmoon:
    description: Allows to run the base bloodmoon command
    default: true
  bloodmoon.show:
    description: Allows to see when a new bloodmoon will take place
    default: true
  bloodmoon.start:
    description: Allows to start a bloodmoon
    default: op
  bloodmoon.stop:
    description: Allows to end a bloodmoon
    default: op
  bloodmoon.reload:
    description: Allows to reload config files
    default: op
  bloodmoon.spawnzombieboss:
    description: Allows spawning the currently configured Blood Moon boss; historical name retained for compatibility
    default: op
  bloodmoon.killbosses:
    description: Allows to kill all bosses at will
    default: op
  bloodmoon.spawnhorde:
    description: Allows to spawn a horde
    default: op
