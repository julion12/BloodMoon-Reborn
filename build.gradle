apply plugin: 'java'

group = 'org.spectralmemories'
version = '1.1.1'

repositories {
    mavenCentral()

    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }

    maven {
        url = 'https://maven.enginehub.org/repo/'
    }

    maven {
        url = 'https://mvn.lumine.io/repository/maven-public/'
    }

    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    from('docs/examples') {
        include '*.yml', '*.txt'
        into 'distribution/EXAMPLES'
    }
    from('LICENSE') {
        into 'META-INF'
        rename 'LICENSE', 'BloodMoon-Reborn-LICENSE.txt'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'

    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'

    compileOnly 'io.lumine:Mythic-Dist:5.12.1'

    compileOnly 'me.clip:placeholderapi:2.12.3'

    implementation 'org.yaml:snakeyaml:2.6'
    compileOnly 'org.jetbrains:annotations:18.0.0'
    testCompileOnly 'org.jetbrains:annotations:18.0.0'

    implementation(files('libs/SQLAccess.jar'))

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'me.clip:placeholderapi:2.12.3'
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    archiveBaseName = 'BloodMoon-Reborn'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.findAll {
            it.name.endsWith('jar')
        }.collect {
            zipTree(it)
        }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
    dependsOn jar
}

tasks.register('jarContentsReport') {
    dependsOn jar
    def output = layout.buildDirectory.file('reports/jar-contents.txt')
    outputs.file(output)
    doLast {
        def entries = []
        new java.util.zip.ZipFile(jar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry -> entries << "${entry.name}\t${entry.size}" }
        }
        output.get().asFile.parentFile.mkdirs()
        output.get().asFile.text = entries.sort().join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.register('releaseChecksum') {
    dependsOn jar
    def output = layout.buildDirectory.file("libs/BloodMoon-Reborn-${project.version}.jar.sha256")
    outputs.file(output)
    doLast {
        def artifact = jar.archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes)
        output.get().asFile.text = digest.encodeHex().toString() + "  " + artifact.name + System.lineSeparator()
    }
}

tasks.register('releaseArtifacts') {
    dependsOn test, jarContentsReport, releaseChecksum
}

task runSpigot(type: Exec) {
    standardInput = System.in

    workingDir 'exes/server'
    commandLine 'cmd', '/c', 'java', '-jar', file('exes/paper.jar'), 'nogui'
}
