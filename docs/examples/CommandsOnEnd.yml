# Copy or merge this key into each BloodMoon world config.yml.
# ;s runs once as console. ;f runs as console per player. ;p runs as each player.
CommandsOnEnd:
  - "say [BloodMoon] La Luna de Sangre terminó en $w;s"
  - "execute in minecraft:overworld run weather clear;s"
  - "effect clear %player% minecraft:night_vision;f"
  - "me ha sobrevivido a la Luna de Sangre;p"
