# Merge this key into each BloodMoon world config.yml.
# ;s runs once as console, ;f once per player as console, and ;p as each player.
CommandsOnStart:
  - "say [BloodMoon] The Blood Moon has begun in %world%;s"
  - "title @a title {\"text\":\"BLOOD MOON\",\"color\":\"dark_red\",\"bold\":true};s"
  - "title @a subtitle {\"text\":\"Survive until dawn\",\"color\":\"red\"};s"
  - "execute in minecraft:overworld run weather thunder;s"
  - "effect give %player% minecraft:night_vision 10 0 true;f"
  - "tellraw %player% {\"text\":\"The night is watching you.\",\"color\":\"red\"};f"
  - "playsound minecraft:entity.wither.spawn master $p;p"
